<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <!-- Chat Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Pilot Wing / Plane Gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Pilot Accent Shadow / Fold -->
    <linearGradient id="planeFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- AI Spark Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Soft Ambient Glow behind Chat Bubble -->
  <circle cx="240" cy="245" r="140" fill="#10b981" opacity="0.18" filter="url(#glow)" />

  <!-- WhatsApp Speech Bubble Shape -->
  <path d="M 256 100
           C 165.4 100 92 173.4 92 264
           C 92 296.2 101.4 326.3 117.6 351.8
           L 100 412
           L 163.4 395.2
           C 190.5 416 222.8 428 256 428
           C 346.6 428 420 354.6 420 264
           C 420 173.4 346.6 100 256 100 Z"
        fill="url(#bubbleGrad)" />

  <!-- Inner WhatsApp Subtle Contour Glow -->
  <path d="M 256 116
           C 174.3 116 108 182.3 108 264
           C 108 293.1 116.5 320.3 131.2 343.3
           L 116.5 395.5
           L 170.8 381.1
           C 195.5 399.2 224.6 412 256 412
           C 337.7 412 404 345.7 404 264
           C 404 182.3 337.7 116 256 116 Z"
        fill="none" stroke="#6ee7b7" stroke-width="4" opacity="0.35" />

  <!-- Dynamic Supersonic Pilot Jet / Paper Plane -->
  <!-- Main Wing Body -->
  <path d="M 366 160
           L 174 274
           C 170 276.5 170 282 174.5 284
           L 236 308
           L 262 368
           C 264.2 373 270.5 373.8 273.8 369.5
           L 296 340
           L 368 164
           C 370 159 369 158 366 160 Z"
        fill="url(#planeGrad)" />

  <!-- Center Wing Fold / Shade (Adds 3D Depth) -->
  <path d="M 366 160
           L 236 308
           L 262 368
           L 282 320
           L 366 160 Z"
        fill="url(#planeFold)" opacity="0.85" />

  <!-- Under-Wing Cutout / Tail Shadow -->
  <path d="M 236 308
           L 254 350
           L 262 318
           Z"
        fill="#047857" opacity="0.9" />

  <!-- Speed Contrails / Aerodynamic Wing Trail -->
  <path d="M 152 296 L 210 318" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 178 334 L 224 352" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" opacity="0.4" />

  <!-- AI Automation Spark / Star (Upper Right of Plane) -->
  <g transform="translate(380, 138) scale(1.1)" filter="url(#glow)">
    <!-- 4-point Diamond Spark -->
    <path d="M 0 -24
             Q 0 0 24 0
             Q 0 0 0 24
             Q 0 0 -24 0
             Q 0 0 0 -24 Z"
          fill="#c6f24e" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Small AI Secondary Spark -->
  <g transform="translate(340, 112) scale(0.65)">
    <path d="M 0 -18
             Q 0 0 18 0
             Q 0 0 0 18
             Q 0 0 -18 0
             Q 0 0 0 -18 Z"
          fill="#38bdf8" />
  </g>
</svg>

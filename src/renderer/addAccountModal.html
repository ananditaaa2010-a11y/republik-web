<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tambah Akun Baru</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      overflow-y: auto;
    }
    h3 {
      font-size: 16px;
      margin-bottom: 3px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Platform Selection Cards */
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .platform-card {
      background: #1e293b;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .platform-card:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .platform-card.selected {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.12);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.25);
    }
    .platform-card[data-platform="telegram"].selected {
      border-color: #0284c7;
      background: rgba(2, 132, 199, 0.12);
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.25);
    }
    .platform-card[data-platform="gmail"].selected {
      border-color: #ea4335;
      background: rgba(234, 67, 53, 0.12);
      box-shadow: 0 0 14px rgba(234, 67, 53, 0.25);
    }
    .platform-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .platform-icon svg {
      width: 100%;
      height: 100%;
    }
    .platform-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1px;
    }
    .platform-desc {
      font-size: 9px;
      color: var(--muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }

    /* Colors */
    .color-grid {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .color-btn:hover {
      transform: scale(1.1);
    }
    .color-btn.selected {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Icon Customization Section */
    .icon-section {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .icon-preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .icon-preview-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .icon-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .icon-preview-box svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
    .icon-preview-box span {
      font-size: 20px;
      line-height: 1;
    }
    .icon-preview-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    .preset-emoji-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .preset-btn {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: #ffffff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.1);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .preset-btn.active {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.2);
    }
    .icon-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-icon-upload {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-icon-upload:hover {
      background: rgba(255, 255, 255, 0.16);
    }
    .btn-icon-reset {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-icon-reset:hover {
      color: #f87171;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    button.action {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div>
    <h3>Tambah Akun Baru</h3>
    <p class="subtitle">Pilih platform & kustomisasi icon akun untuk sidebar Republik Web.</p>

    <label>Pilih Platform:</label>
    <div class="platform-grid">
      <div class="platform-card selected" data-platform="whatsapp">
        <div class="platform-icon">
          <svg viewBox="0 0 16 16" fill="#22c55e">
            <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
          </svg>
        </div>
        <div class="platform-title">WhatsApp</div>
        <div class="platform-desc">WhatsApp Web</div>
      </div>

      <div class="platform-card" data-platform="telegram">
        <div class="platform-icon">
          <svg viewBox="0 0 24 24" fill="#38bdf8">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
          </svg>
        </div>
        <div class="platform-title">Telegram</div>
        <div class="platform-desc">Telegram Web</div>
      </div>

      <div class="platform-card" data-platform="gmail">
        <div class="platform-icon">
          <svg viewBox="0 0 24 24" fill="#f87171">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <div class="platform-title">Gmail</div>
        <div class="platform-desc">Google Mail</div>
      </div>
    </div>

    <label for="accName">Nama / Label Akun:</label>
    <input type="text" id="accName" placeholder="Contoh: CS WhatsApp / Personal WA" autofocus>

    <label>Warna Background Sidebar:</label>
    <div class="color-grid">
      <div class="color-btn selected" data-color="#10b981" style="background:#10b981"></div>
      <div class="color-btn" data-color="#0284c7" style="background:#0284c7"></div>
      <div class="color-btn" data-color="#ea4335" style="background:#ea4335"></div>
      <div class="color-btn" data-color="#6366f1" style="background:#6366f1"></div>
      <div class="color-btn" data-color="#f59e0b" style="background:#f59e0b"></div>
      <div class="color-btn" data-color="#ec4899" style="background:#ec4899"></div>
      <div class="color-btn" data-color="#8b5cf6" style="background:#8b5cf6"></div>
    </div>

    <!-- Icon Customizer -->
    <label>Icon Akun (Kustom atau Bawaan):</label>
    <div class="icon-section">
      <div class="icon-preview-row">
        <div class="icon-preview-box" id="previewBox">
          <!-- Live Preview -->
        </div>
        <div class="icon-preview-desc">
          <strong id="previewTitle">Icon Bawaan Platform</strong><br>
          <span id="previewSub">Otomatis menampilkan logo platform resmi di sidebar.</span>
        </div>
      </div>

      <div class="preset-emoji-row">
        <div class="preset-btn" data-icon="🏢" title="Kantor">🏢</div>
        <div class="preset-btn" data-icon="💼" title="Bisnis">💼</div>
        <div class="preset-btn" data-icon="👤" title="Pribadi">👤</div>
        <div class="preset-btn" data-icon="🛒" title="Toko/Sales">🛒</div>
        <div class="preset-btn" data-icon="💬" title="Customer Service">💬</div>
        <div class="preset-btn" data-icon="⭐" title="Utama">⭐</div>
        <div class="preset-btn" data-icon="🔥" title="Hot / Prioritas">🔥</div>
        <div class="preset-btn" data-icon="🤖" title="Bot">🤖</div>
        <div class="preset-btn" data-icon="📱" title="Mobile">📱</div>
        <div class="preset-btn" data-icon="🎯" title="Target">🎯</div>
      </div>

      <div class="icon-actions">
        <input type="file" id="iconFileInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none">
        <button type="button" class="btn-icon-upload" id="btnUploadIcon">📁 Upload Foto / Gambar Sendiri...</button>
        <button type="button" class="btn-icon-reset" id="btnResetIcon" style="display:none">Gunakan Icon Default</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="action btn-secondary" id="btnCancel">Batal</button>
    <button class="action btn-primary" id="btnSave">Simpan Akun</button>
  </div>

  <script>
    let selectedPlatform = 'whatsapp';
    let selectedColor = '#10b981';
    let selectedCustomIcon = ''; // Empty string = use default platform icon

    const defaultColors = {
      whatsapp: '#10b981',
      telegram: '#0284c7',
      gmail: '#ea4335'
    };

    const placeholders = {
      whatsapp: 'Contoh: CS WhatsApp / Personal WA',
      telegram: 'Contoh: Telegram Support / Komunitas',
      gmail: 'Contoh: Email Kantor / Admin Gmail'
    };

    const PLATFORM_DEFAULT_SVGS = {
      whatsapp: `<svg viewBox="0 0 16 16"><path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/></svg>`,
      telegram: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>`,
      gmail: `<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>`
    };

    const accNameInput = document.getElementById('accName');
    const previewBox = document.getElementById('previewBox');
    const previewTitle = document.getElementById('previewTitle');
    const previewSub = document.getElementById('previewSub');
    const btnResetIcon = document.getElementById('btnResetIcon');
    const iconFileInput = document.getElementById('iconFileInput');
    const btnUploadIcon = document.getElementById('btnUploadIcon');

    function updatePreview() {
      previewBox.style.backgroundColor = selectedColor;

      if (selectedCustomIcon) {
        btnResetIcon.style.display = 'inline-block';
        if (selectedCustomIcon.startsWith('data:image/') || selectedCustomIcon.startsWith('http')) {
          previewBox.innerHTML = `<img src="${selectedCustomIcon}" alt="Custom Icon">`;
          previewTitle.innerText = 'Foto / Gambar Kustom';
          previewSub.innerText = 'Gambar ini akan tampil sebagai icon akun di sidebar.';
        } else {
          previewBox.innerHTML = `<span>${selectedCustomIcon}</span>`;
          previewTitle.innerText = `Emoji Kustom (${selectedCustomIcon})`;
          previewSub.innerText = 'Emoji ini akan tampil sebagai icon akun di sidebar.';
        }
      } else {
        btnResetIcon.style.display = 'none';
        const svg = PLATFORM_DEFAULT_SVGS[selectedPlatform] || PLATFORM_DEFAULT_SVGS.whatsapp;
        previewBox.innerHTML = svg;
        previewTitle.innerText = `Icon Resmi ${selectedPlatform.toUpperCase()}`;
        previewSub.innerText = 'Otomatis menampilkan logo resmi platform di sidebar.';
      }

      // Sync active state of preset buttons
      document.querySelectorAll('.preset-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.icon === selectedCustomIcon);
      });
    }

    // Platform card selection
    document.querySelectorAll('.platform-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.platform-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedPlatform = card.dataset.platform;

        // Auto select recommended color
        const targetColor = defaultColors[selectedPlatform] || '#10b981';
        selectedColor = targetColor;
        document.querySelectorAll('.color-btn').forEach(b => {
          b.classList.toggle('selected', b.dataset.color === targetColor);
        });

        accNameInput.placeholder = placeholders[selectedPlatform] || 'Nama Akun';
        updatePreview();
      });
    });

    // Color picker
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedColor = btn.dataset.color;
        updatePreview();
      });
    });

    // Preset emoji selection
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCustomIcon = btn.dataset.icon;
        updatePreview();
      });
    });

    // Reset icon to default
    btnResetIcon.addEventListener('click', () => {
      selectedCustomIcon = '';
      iconFileInput.value = '';
      updatePreview();
    });

    // Upload image button
    btnUploadIcon.addEventListener('click', () => {
      iconFileInput.click();
    });

    // Handle custom image file upload & compression
    iconFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Resize to max 128x128 to keep storage light and fast
          const maxDim = 128;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            }
          } else {
            if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          selectedCustomIcon = canvas.toDataURL('image/png');
          updatePreview();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      if (window.modalAPI) {
        window.modalAPI.closeModal();
      } else {
        window.close();
      }
    });

    let isSubmitting = false;
    document.getElementById('btnSave').addEventListener('click', () => {
      if (isSubmitting) return;
      isSubmitting = true;
      const defaultName = selectedPlatform === 'whatsapp' ? 'WhatsApp' : (selectedPlatform === 'telegram' ? 'Telegram' : 'Gmail');
      const name = accNameInput.value.trim() || defaultName;

      if (window.modalAPI) {
        window.modalAPI.confirmAdd({
          name,
          color: selectedColor,
          platform: selectedPlatform,
          icon: selectedCustomIcon
        });
        window.modalAPI.closeModal();
      } else {
        window.close();
      }
    });

    accNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btnSave').click();
      } else if (e.key === 'Escape') {
        if (window.modalAPI) window.modalAPI.closeModal(); else window.close();
      }
    });

    // Initial render
    updatePreview();
  </script>
</body>
</html>

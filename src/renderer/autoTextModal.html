<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Auto Text & Template Pesan</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Header */
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090e1a;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-tab {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34d399;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .btn-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* Main Container (Split Columns) */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Panel: Template List */
    .sidebar-list {
      width: 290px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #111827;
    }
    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .btn-new {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .btn-new:hover {
      background: var(--primary-hover);
    }
    .template-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .template-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .template-item:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--card-hover);
    }
    .template-item.active {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.08);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.3);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .item-shortcut {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .item-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-left: 6px;
      flex: 1;
    }
    .item-preview {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }

    /* Right Panel: Editor & Live Preview */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 18px 24px;
      background: var(--bg);
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-row {
      display: flex;
      gap: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-text {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-text:focus {
      border-color: var(--primary);
    }
    .input-shortcut {
      font-family: monospace;
      color: var(--accent);
      font-weight: 600;
    }
    .textarea-content {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      min-height: 110px;
      resize: vertical;
      font-family: inherit;
    }
    .textarea-content:focus {
      border-color: var(--primary);
    }

    /* Variable Chips */
    .variable-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    .chips-label {
      font-size: 11px;
      color: var(--muted);
      margin-right: 4px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-size: 11px;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: #34d399;
    }

    /* Live Preview Box */
    .preview-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      position: relative;
    }
    .preview-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .preview-content {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Footer */
    .footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090e1a;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span class="badge-tab">TAB EXPAND</span>
      <div>
        <div class="title">Auto Text & Template Pesan</div>
        <div class="subtitle">Ketik kata kunci di chat WhatsApp, Telegram, atau Gmail lalu tekan TAB untuk ekspansi.</div>
      </div>
    </div>
    <button class="btn-close" id="btnClose" title="Tutup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Container -->
  <div class="container">
    <!-- Left: List -->
    <div class="sidebar-list">
      <div class="search-box">
        <input type="text" class="search-input" id="searchFilter" placeholder="Cari shortcut atau judul..." />
        <button class="btn-new" id="btnNew" title="Tambah Template Baru">+</button>
      </div>
      <div class="template-list" id="templateList">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Right: Editor -->
    <div class="editor-panel">
      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label for="inputShortcut">Kata Kunci / Shortcut (Tekan TAB)</label>
          <input type="text" class="input-text input-shortcut" id="inputShortcut" placeholder="contoh: hello, rek, /ongkir" />
        </div>
        <div class="form-group" style="flex: 2;">
          <label for="inputTitle">Judul / Keterangan</label>
          <input type="text" class="input-text" id="inputTitle" placeholder="contoh: Sapaan Pelanggan" />
        </div>
      </div>

      <div class="form-group">
        <label>Sisipkan Variabel Otomatis</label>
        <div class="variable-chips">
          <span class="chips-label">Klik untuk menyisipkan:</span>
          <button type="button" class="chip" data-var="{nama}" title="Otomatis mengambil nama kontak lawan bicara di WhatsApp/Telegram/Gmail">{nama}</button>
          <button type="button" class="chip" data-var="{waktu}" title="Salam waktu otomatis (pagi / siang / sore / malam)">{waktu}</button>
          <button type="button" class="chip" data-var="{jam}" title="Format JJ:MM (cth: 14:30)">{jam}</button>
          <button type="button" class="chip" data-var="{tanggal}" title="Format DD/MM/YYYY">{tanggal}</button>
          <button type="button" class="chip" data-var="{hari}" title="Nama Hari (Senin, Selasa...)">{hari}</button>
        </div>

        <label for="inputContent">Isi Template Pesan</label>
        <textarea class="textarea-content" id="inputContent" placeholder="Tulis isi pesan template di sini..."></textarea>
      </div>

      <!-- Live Preview -->
      <div class="preview-box">
        <div class="preview-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Pratinjau Hasil Ekspansi:
        </div>
        <div class="preview-content" id="previewContent">Halo Kak Budi, selamat datang! Ada yang bisa kami bantu?</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div>
      <button class="btn btn-secondary" id="btnResetDefaults" title="Kembalikan template bawaan">Reset ke Default</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-danger" id="btnDelete" style="display: none;">Hapus</button>
      <button class="btn btn-secondary" id="btnCancelEdit">Batal</button>
      <button class="btn btn-primary" id="btnSave">Simpan Template</button>
    </div>
  </div>

  <script>
    let templates = [];
    let currentEditingId = null;

    const templateListEl = document.getElementById('templateList');
    const searchFilterEl = document.getElementById('searchFilter');
    const inputShortcutEl = document.getElementById('inputShortcut');
    const inputTitleEl = document.getElementById('inputTitle');
    const inputContentEl = document.getElementById('inputContent');
    const previewContentEl = document.getElementById('previewContent');
    const btnSaveEl = document.getElementById('btnSave');
    const btnDeleteEl = document.getElementById('btnDelete');
    const btnNewEl = document.getElementById('btnNew');
    const btnCancelEditEl = document.getElementById('btnCancelEdit');
    const btnResetDefaultsEl = document.getElementById('btnResetDefaults');
    const btnCloseEl = document.getElementById('btnClose');

    async function loadTemplates() {
      if (window.autoTextAPI) {
        const data = await window.autoTextAPI.getAll();
        templates = Array.isArray(data) ? data : [];
      } else {
        templates = [
          { id: '1', shortcut: 'hello', title: 'Sapaan Pelanggan', content: 'Halo {nama}, selamat datang!' },
          { id: '2', shortcut: 'ongkir', title: 'Cek Ongkir', content: 'Mohon info alamat tujuan ya {nama}.' }
        ];
      }
      renderList();
      if (templates.length > 0) {
        selectTemplate(templates[0].id);
      } else {
        resetForm();
      }
    }

    function renderList() {
      const query = (searchFilterEl.value || '').trim().toLowerCase();
      templateListEl.innerHTML = '';

      const filtered = templates.filter(t => 
        (t.shortcut && t.shortcut.toLowerCase().includes(query)) ||
        (t.title && t.title.toLowerCase().includes(query)) ||
        (t.content && t.content.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        templateListEl.innerHTML = '<div class="empty-state">Tidak ada template ditemukan.</div>';
        return;
      }

      filtered.forEach(t => {
        const item = document.createElement('div');
        item.className = 'template-item' + (t.id === currentEditingId ? ' active' : '');
        item.innerHTML = `
          <div class="item-header">
            <span class="item-shortcut">${escapeHtml(t.shortcut)}</span>
            <span class="item-title">${escapeHtml(t.title || t.shortcut)}</span>
          </div>
          <div class="item-preview">${escapeHtml(t.content || '')}</div>
        `;
        item.addEventListener('click', () => selectTemplate(t.id));
        templateListEl.appendChild(item);
      });
    }

    function selectTemplate(id) {
      const item = templates.find(t => t.id === id);
      if (!item) return;

      currentEditingId = item.id;
      inputShortcutEl.value = item.shortcut || '';
      inputTitleEl.value = item.title || '';
      inputContentEl.value = item.content || '';
      btnDeleteEl.style.display = 'inline-flex';

      updatePreview();
      renderList();
    }

    function resetForm() {
      currentEditingId = null;
      inputShortcutEl.value = '';
      inputTitleEl.value = '';
      inputContentEl.value = '';
      btnDeleteEl.style.display = 'none';
      inputShortcutEl.focus();
      updatePreview();
      renderList();
    }

    function updatePreview() {
      const text = inputContentEl.value || '';
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const jam = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const tanggal = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const hari = days[now.getDay()];

      const hour = now.getHours();
      let waktu = 'pagi';
      if (hour >= 11 && hour < 15) {
        waktu = 'siang';
      } else if (hour >= 15 && hour < 18) {
        waktu = 'sore';
      } else if (hour >= 18 || hour < 5) {
        waktu = 'malam';
      }

      const preview = text
        .replace(/\{nama\}/gi, 'Budi')
        .replace(/\{jam\}/gi, jam)
        .replace(/\{tanggal\}/gi, tanggal)
        .replace(/\{hari\}/gi, hari)
        .replace(/\{waktu\}/gi, waktu);

      previewContentEl.textContent = preview || '(Pratinjau kosong)';
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Variable insertion into textarea
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const varText = btn.getAttribute('data-var');
        if (!varText) return;

        const start = inputContentEl.selectionStart;
        const end = inputContentEl.selectionEnd;
        const val = inputContentEl.value;

        inputContentEl.value = val.substring(0, start) + varText + val.substring(end);
        inputContentEl.selectionStart = inputContentEl.selectionEnd = start + varText.length;
        inputContentEl.focus();
        updatePreview();
      });
    });

    // Real-time preview updates
    inputContentEl.addEventListener('input', updatePreview);
    inputShortcutEl.addEventListener('input', () => {
      inputShortcutEl.value = inputShortcutEl.value.toLowerCase().replace(/\s+/g, '');
    });
    searchFilterEl.addEventListener('input', renderList);

    // Save action
    btnSaveEl.addEventListener('click', async () => {
      const shortcut = inputShortcutEl.value.trim().toLowerCase().replace(/\s+/g, '');
      const title = inputTitleEl.value.trim() || shortcut;
      const content = inputContentEl.value.trim();

      if (!shortcut) {
        alert('Mohon masukkan kata kunci shortcut.');
        inputShortcutEl.focus();
        return;
      }
      if (!content) {
        alert('Mohon masukkan isi template pesan.');
        inputContentEl.focus();
        return;
      }

      if (window.autoTextAPI) {
        const res = await window.autoTextAPI.save({
          id: currentEditingId,
          shortcut,
          title,
          content
        });
        if (res && res.item) {
          templates = await window.autoTextAPI.getAll();
          selectTemplate(res.item.id);

          const origText = btnSaveEl.textContent;
          btnSaveEl.textContent = '✓ Tersimpan!';
          btnSaveEl.style.background = '#059669';
          setTimeout(() => {
            btnSaveEl.textContent = origText;
            btnSaveEl.style.background = '';
          }, 1200);
        }
      }
    });

    // Delete action
    btnDeleteEl.addEventListener('click', async () => {
      if (!currentEditingId) return;
      if (confirm('Yakin ingin menghapus template ini?')) {
        if (window.autoTextAPI) {
          await window.autoTextAPI.delete(currentEditingId);
          templates = await window.autoTextAPI.getAll();
          if (templates.length > 0) {
            selectTemplate(templates[0].id);
          } else {
            resetForm();
          }
        }
      }
    });

    // New button
    btnNewEl.addEventListener('click', resetForm);
    btnCancelEditEl.addEventListener('click', () => {
      if (currentEditingId) {
        selectTemplate(currentEditingId);
      } else {
        resetForm();
      }
    });

    // Reset Defaults
    btnResetDefaultsEl.addEventListener('click', async () => {
      if (confirm('Kembalikan semua template ke daftar bawaan? Template kustom Anda akan diganti.')) {
        if (window.autoTextAPI) {
          templates = await window.autoTextAPI.resetDefaults();
          if (templates.length > 0) {
            selectTemplate(templates[0].id);
          } else {
            resetForm();
          }
        }
      }
    });

    // Close
    btnCloseEl.addEventListener('click', () => {
      if (window.autoTextAPI) {
        window.autoTextAPI.closeModal();
      } else {
        window.close();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.autoTextAPI) window.autoTextAPI.closeModal(); else window.close();
      }
    });

    // Init
    loadTemplates();
  </script>
</body>
</html>
